name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, tipos e pacote
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar tipos
        run: npm run typecheck
      - name: Executar testes
        run: npm test
      - name: Gerar build
        run: npm run build
      - name: Testar pacote compilado
        run: npm run test:dist
      - name: Validar conteúdo do pacote npm
        run: npm pack --dry-run
